version: "3.8"

services:
  # --- BACKEND (NestJS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm_backend
    restart: always
    ports:
      - "3001:3000"
    # XÓA BỎ HOẶC COMMENT ĐOẠN VOLUMES NÀY
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
    networks:
      - hrm-network

  # --- FRONTEND (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm_frontend
    restart: always
    ports:
      - "3000:3000"
    # XÓA BỎ HOẶC COMMENT ĐOẠN VOLUMES NÀY
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://backend:3000
    networks:
      - hrm-network

networks:
  hrm-network:
    driver: bridge