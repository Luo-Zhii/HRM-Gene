variables:
  USER_PROJECT: "ubuntu"
  SEMGREP_REPORT: "semgrep_sast_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_report"
  SNYKSCAN_REPORT: "snyk_scan_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_report"
  TRIVYFS_REPORT: "trivyfs_scan_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_report"
  OWASP_ZAP_REPORT: "owasp_zap_dast_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_report"
  K6_PERF_REPORT: "k6_performance_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_report"

stages:
  - sast-sca
  - unit-integration-test
  - deploy-staging
  - gray-box-test
  - e2e-test
  - dast
  - performance-test

# ==========================================
# STAGE 1: SAST & SCA
# ==========================================
semgrep_sast:
  stage: sast-sca
  variables:
    GIT_STRATEGY: clone
  script:
    - echo "[SAST] Running Semgrep source code scan..."
    - docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep scan --config auto --json -o /src/${SEMGREP_REPORT}.json /src || true
    - |
      python3 - <<'PYEOF'
      import json, os, html, datetime
      report_base = os.environ.get("SEMGREP_REPORT", "semgrep_report")
      json_path   = report_base + ".json"
      html_path   = report_base + ".html"
      try:
          with open(json_path) as f:
              data = json.load(f)
      except Exception as e:
          data = {"results": [], "errors": [str(e)]}
      results = data.get("results", [])
      errors  = data.get("errors", [])
      sev_color = {"ERROR": "#e53935", "WARNING": "#fb8c00", "INFO": "#1e88e5"}
      rows = ""
      for r in results:
          sev   = r.get("extra", {}).get("severity", "INFO").upper()
          color = sev_color.get(sev, "#757575")
          path  = html.escape(r.get("path", ""))
          line  = r.get("start", {}).get("line", "")
          msg   = html.escape(r.get("extra", {}).get("message", "").strip())
          rule  = html.escape(r.get("check_id", ""))
          code  = html.escape(r.get("extra", {}).get("lines", "").strip())
          rows += f"""<tr>
            <td><span style="background:{color};color:#fff;padding:2px 8px;border-radius:4px;font-size:12px">{sev}</span></td>
            <td><code>{path}:{line}</code></td>
            <td>{msg}</td>
            <td style="font-size:11px;color:#888">{rule}</td>
            <td><pre style="margin:0;font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:4px 8px;border-radius:4px">{code}</pre></td>
          </tr>"""
      total  = len(results)
      errors_count = len(errors)
      ts     = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
      page = f"""<!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Semgrep SAST Report</title>
        <style>
          *{{box-sizing:border-box;margin:0;padding:0}}
          body{{font-family:Inter,system-ui,sans-serif;background:#0f0f1a;color:#e0e0e0;padding:32px}}
          h1{{font-size:28px;font-weight:700;color:#a6e3a1;margin-bottom:4px}}
          .sub{{color:#888;margin-bottom:24px;font-size:14px}}
          .badges{{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}}
          .badge{{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600}}
          .b-total{{background:#1e1e2e;border:1px solid #444;color:#cdd6f4}}
          .b-err{{background:#3b1a1a;border:1px solid #e53935;color:#ef9a9a}}
          .b-warn{{background:#2d2010;border:1px solid #fb8c00;color:#ffcc80}}
          .b-info{{background:#0d1f35;border:1px solid #1e88e5;color:#90caf9}}
          table{{width:100%;border-collapse:collapse;background:#1a1a2e;border-radius:10px;overflow:hidden}}
          thead{{background:#12122a}}
          th{{padding:12px 16px;text-align:left;font-size:13px;color:#888;text-transform:uppercase;letter-spacing:.5px}}
          td{{padding:10px 16px;border-bottom:1px solid #2a2a40;font-size:13px;vertical-align:top}}
          tr:last-child td{{border-bottom:none}}
          tr:hover td{{background:#1e1e36}}
          .empty{{text-align:center;padding:40px;color:#555;font-size:16px}}
        </style>
      </head>
      <body>
        <h1>🔍 Semgrep SAST Report</h1>
        <div class="sub">Generated: {ts}</div>
        <div class="badges">
          <span class="badge b-total">Total findings: {total}</span>
          <span class="badge b-err">Errors (parse): {errors_count}</span>
        </div>
        <table>
          <thead><tr><th>Severity</th><th>Location</th><th>Message</th><th>Rule</th><th>Code</th></tr></thead>
          <tbody>{"" if rows else '<tr><td colspan="5" class="empty">✅ No findings detected</td></tr>'}{rows}</tbody>
        </table>
      </body>
      </html>"""
      with open(html_path, "w") as f:
          f.write(page)
      print(f"[SAST] HTML report written → {html_path}  ({total} findings)")
      PYEOF
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - ${SEMGREP_REPORT}.html
    expire_in: 7 days

trivyfs_scan:
  stage: sast-sca
  variables:
    GIT_STRATEGY: clone
  script:
    - docker run --rm -v $PWD:/${CI_PROJECT_NAME} -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy fs /${CI_PROJECT_NAME} --severity HIGH,CRITICAL --format template --template "@contrib/html.tpl" --output /${CI_PROJECT_NAME}/$TRIVYFS_REPORT.html || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - $TRIVYFS_REPORT.html
    expire_in: 7 days

snyk_scan:
  stage: sast-sca
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --rm --network host --build-arg SNYK_AUTH_TOKEN=$SNYK_TOKEN --build-arg OUTPUT_FILENAME=$SNYKSCAN_REPORT -t $SNYKSCAN_REPORT -f Dockerfile-snyk . || true
    - docker create --name $SNYKSCAN_REPORT $SNYKSCAN_REPORT || true
    - docker cp $SNYKSCAN_REPORT:/app/${SNYKSCAN_REPORT}.html . || true
    - docker rm -f $SNYKSCAN_REPORT || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - ${SNYKSCAN_REPORT}.html
    expire_in: 7 days

# ==========================================
# STAGE 2: UNIT & INTEGRATION (White-box Testing)
# ==========================================
run_white_box_testing:
  stage: unit-integration-test
  variables:
    GIT_STRATEGY: clone
  script:
    - echo "[TEST] Running Unit/Integration Tests..."
    - npm install --prefix backend --legacy-peer-deps
    - npm install --prefix frontend --legacy-peer-deps
    - npm run test:cov
    - npm run test:report || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - white-box-coverage-test-reports/
    expire_in: 7 days
    when: always

# ==========================================
# STAGE 3: DEPLOY TO STAGING
# ==========================================
deploy_staging:
  stage: deploy-staging
  variables:
    GIT_STRATEGY: clone
  script:
    - echo "[DEPLOY] Deploying application to Staging environment..."
    - docker-compose down || true
    - docker system prune -a --volumes -f || true
    - docker-compose up -d --build
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
# ==========================================
# STAGE 3.5: GRAY-BOX INTEGRATION TESTING (HTTP + DB)
# ==========================================
run_gray_box_testing:
  stage: gray-box-test
  allow_failure: true
  variables:
    GIT_STRATEGY: clone
    TEST_HOST: "http://localhost:3001"
  before_script:
    - echo "[GRAY-BOX] Installing backend dependencies..."
    - npm install --prefix backend --legacy-peer-deps
  script:
    - echo "[GRAY-BOX] Waiting 15s for Staging to be ready..."
    - sleep 15
    - echo "[GRAY-BOX] Checking server availability at $TEST_HOST..."
    - |
      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" $TEST_HOST/api/employees/directory || echo "000")
        if [ "$STATUS" != "000" ]; then
          echo "[GRAY-BOX] Server responded with HTTP $STATUS — proceeding."
          break
        fi
        echo "[GRAY-BOX] Attempt $i/30 — server not ready, retrying in 5s..."
        sleep 5
      done
    - echo "[GRAY-BOX] Running gray-box integration tests..."
    - cd backend && npm run test:gray || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    name: "gray-box-test-reports"
    paths:
      - backend/gray-test-api/gray-test-report.html
      - backend/gray-test-api/gray-test-summary-report.html
    expire_in: 7 days
    when: always

# ==========================================
# STAGE 4: E2E TESTING (Black-box)
# ==========================================
run_e2e_testing:
  stage: e2e-test
  allow_failure: true
  variables:
    GIT_STRATEGY: clone
  script:
    - echo "[E2E] Waiting 30s for Staging to boot..."
    - sleep 30
    - echo "[E2E] Running Playwright E2E tests..."
    - cd black-box-e2e
    - npm install --legacy-peer-deps
    - npx playwright install --with-deps chromium
    - TARGET_URL=$TARGET_URL npx playwright test --project=chromium || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - black-box-e2e/e2e-report/
    expire_in: 7 days
    when: always

# ==========================================
# STAGE 5: DAST (OWASP ZAP)
# ==========================================
owasp_zap_dast:
  stage: dast
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - if [ -z "$TARGET_URL" ]; then echo "ERROR - TARGET_URL variable is not configured in GitLab CI/CD Variables!"; exit 1; fi
  script:
    - echo "[DAST] Running OWASP ZAP baseline scan against $TARGET_URL ..."
    - REPORT_FILE="${OWASP_ZAP_REPORT}.html"
    - docker run --rm -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t $TARGET_URL -r $REPORT_FILE || true
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
    - |
      if [ ! -f "$REPORT_FILE" ]; then
        echo "[DAST] WARNING - ZAP did not produce a report. Creating placeholder HTML..."
        cat > "$REPORT_FILE" <<HTMLEOF
      <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>ZAP DAST Report</title>
      <style>body{font-family:sans-serif;background:#0f0f1a;color:#e0e0e0;padding:40px;text-align:center}</style></head>
      <body><h1 style="color:#fb8c00">&#9888; ZAP Scan Report Not Generated</h1>
      <p>The OWASP ZAP scan did not produce a report file.</p>
      <p>Target URL: $TARGET_URL</p>
      <p>Please check the job log for details.</p></body></html>
      HTMLEOF
      fi
    - echo "[DAST] Report file:"
    - ls -lah "$REPORT_FILE" || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    paths:
      - "${OWASP_ZAP_REPORT}.html"
    expire_in: 7 days
    when: always

# ==========================================
# STAGE 6: PERFORMANCE TESTING (k6)
# ==========================================
performance_testing:
  stage: performance-test
  allow_failure: true
  variables:
    GIT_STRATEGY: clone
  parallel:
    matrix:
      - TEST_TYPE: [smoke, load, stress, soak]
  before_script:
    - if [ -z "$TARGET_URL" ]; then echo "ERROR - TARGET_URL variable is not configured!"; exit 1; fi
  script:
    - echo "[PERF] Running $TEST_TYPE performance test..."
    - docker run --rm -v $(pwd)/performace_testing_script:/scripts -e TARGET_URL=$TARGET_URL -e TEST_TYPE=$TEST_TYPE grafana/k6 run /scripts/tests/main-test.js || true
    - echo "[PERF] Collecting report files..."
    - cp performace_testing_script/k6_report_${TEST_TYPE}.html ./${K6_PERF_REPORT}_${TEST_TYPE}.html || true
    - cp performace_testing_script/summary_perf.html ./summary_perf_${TEST_TYPE}.html || true
    - cp performace_testing_script/k6_dashboard.html ./k6_dashboard.html || true
    - echo "[PERF] Reports collected:"
    - ls -lah ./*.html || true
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner $(pwd) || true
  tags:
    - shared-runner-dev-shell
  only:
    - main
  artifacts:
    name: "perf-report-${TEST_TYPE}"
    paths:
      - ${K6_PERF_REPORT}_${TEST_TYPE}.html
      - summary_perf_${TEST_TYPE}.html
      - k6_dashboard.html
    expire_in: 7 days
    when: always