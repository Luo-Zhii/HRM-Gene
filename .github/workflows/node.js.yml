name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted 

    strategy:
      matrix:
        node-version: [22.x] # Dùng bản Node ổn định

    steps:
    - name: Fix workspace permission before checkout
      run: |
        sudo chown -R ubuntu:ubuntu /home/ubuntu/actions-runner/_work/HRM-Gene || true
        sudo chmod -R u+rwX /home/ubuntu/actions-runner/_work/HRM-Gene || true
        sudo rm -rf /home/ubuntu/actions-runner/_work/HRM-Gene/HRM-Gene/backend/dist || true
        sudo rm -rf /home/ubuntu/actions-runner/_work/HRM-Gene/HRM-Gene/frontend/.next || true

    - name: Checkout source
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # Quan trọng: Chỉ định đường dẫn file lock để cache hoạt động đúng
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # --- PHẦN BACKEND (NestJS) ---
    - name: Install Backend Dependencies
      working-directory: ./backend  # Đi vào thư mục backend
      run: npm ci --legacy-peer-deps

    - name: Build Backend
      working-directory: ./backend
      run: npm run build

    # --- PHẦN FRONTEND (Next.js) ---
    - name: Install Frontend Dependencies
      working-directory: ./frontend  # Đi vào thư mục frontend
      run: npm ci --legacy-peer-deps

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build